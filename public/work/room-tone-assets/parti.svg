<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="currentColor" stroke-linecap="round" role="img" aria-label="Three rings close in on a dot one at a time: light, then the disco ball, then music">
  <title>room_tone: the room closes in one layer at a time</title>
  <!-- three layers, outer arrives first -->
  <circle cx="200" cy="150" r="104" stroke-width="1" stroke-dasharray="2 5"/>
  <circle cx="200" cy="150" r="72" stroke-width="1"/>
  <circle cx="200" cy="150" r="40" stroke-width="2.5"/>
  <!-- the person at the desk -->
  <circle cx="200" cy="150" r="5" fill="currentColor" stroke="none"/>
  <!-- the move: inward, gently -->
  <path d="M304 150 H252" stroke="var(--accent, #002BBA)" stroke-width="1.5"/>
  <path d="M252 150 l8 -5 M252 150 l8 5" stroke="var(--accent, #002BBA)" stroke-width="1.5"/>
</svg>
