<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>room_tone Layers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Geist+Mono&display=swap">
<style>
/* Layout: one quiet panel with three objects, a small decision tree that doubles as the progress bar, one line of text. Fades only. */
:root{--bg:#FFFFFF;--panel:#F4F4F2;--ink:#141414;--gray:#6E6E6B;--faint:#D4D4CF;--accent:#002BBA;--warm:#F2C46B;--sans:'Instrument Sans',Helvetica,Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:0}
main{max-width:none;margin:0;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border-radius:6px}
svg{width:100%;height:auto;display:block}
.line{font-size:17px;margin:4px 0 0;min-height:1.5em;transition:opacity 1.2s ease;color:var(--ink)}
.cur{display:inline-block;width:1.5px;height:1em;background:var(--ink);margin-left:3px;vertical-align:-2px;animation:blink 1.6s ease-in-out infinite;opacity:0}
.cur{visibility:hidden}.cur.on{visibility:visible}
@keyframes blink{0%,100%{opacity:.85}50%{opacity:.1}}
.tree text{font-size:11px;fill:var(--gray);transition:fill .9s}
.tree text.on{fill:var(--ink)}
.tree circle{transition:fill .9s,stroke .9s}
.tree .hit{cursor:pointer}
.tree .hit:focus-visible{outline:none}.tree .hit:focus-visible circle{stroke:var(--accent);stroke-width:2}
 .term{margin:0 40px 22px;padding:12px 0 0;border-top:1px solid var(--faint);color:var(--gray);font:12px/1.7 'Geist Mono',ui-monospace,Menlo,monospace;height:calc(1.7em*5 + 12px);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.term div{opacity:0;transition:opacity 1.4s ease;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.term div.in{opacity:1;color:var(--ink)}.term div.old{opacity:.5;color:var(--gray)}
.term .p{color:var(--gray)}
.term .cur{display:inline-block;width:6px;height:1.05em;background:var(--ink);margin-left:4px;vertical-align:-2px;animation:blink 1.6s ease-in-out infinite;visibility:hidden}
.term .cur.on{visibility:visible}
@media (max-width:560px){.tree .end{display:none}.tree text{font-size:13px}.term{margin:0 18px 16px;font-size:11px}}
.note{font-size:14px;color:var(--gray);margin:0;max-width:62ch}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
</head><body><main>
  <div class="panel">
    <svg viewBox="0 0 640 260" fill="none" stroke-linecap="round" role="img" aria-label="A lamp, a disco ball and a speaker. After 90 minutes the lamp glows, then the ball slowly turns and the room asks if I'll take a moment. If I pause, music plays; if I keep working, it all fades away.">
      <defs><radialGradient id="g"><stop offset="0" stop-color="var(--warm)" stop-opacity=".55"/><stop offset="1" stop-color="var(--warm)" stop-opacity="0"/></radialGradient></defs>
      <g transform="translate(160 130)">
        <circle id="glow" r="80" fill="url(#g)" opacity="0"/>
        <path d="M-16 -10 L16 -10 L9 -28 L-9 -28 Z" stroke="var(--ink)" stroke-width="2" fill="var(--panel)"/>
        <path d="M0 -10 V36 M-14 36 H14" stroke="var(--ink)" stroke-width="2"/>
      </g>
      <g transform="translate(320 120)">
        <path d="M0 -60 V-26" stroke="var(--ink)" stroke-width="1.5"/>
        <circle r="26" stroke="var(--ink)" stroke-width="2" fill="var(--panel)"/>
        <g opacity=".5" stroke="var(--ink)" stroke-width=".9">
          <path d="M-26 0 H26 M-22 -13 H22 M-22 13 H22"/>
          <ellipse id="m1" rx="13" ry="26"/><ellipse id="m2" rx="13" ry="26"/>
        </g>
        <g id="flecks" fill="var(--accent)" opacity="0"></g>
      </g>
      <g transform="translate(480 130)">
        <rect x="-14" y="-24" width="28" height="48" rx="4" stroke="var(--ink)" stroke-width="2" fill="var(--panel)"/>
        <circle cx="0" cy="4" r="8" stroke="var(--ink)" stroke-width="1.5"/>
        <g id="volg" transform="translate(-44 48)" opacity="0">
          <rect x="0" y="-2" width="88" height="4" rx="2" fill="var(--faint)" stroke="none"/>
          <rect id="vfill" x="0" y="-2" width="0" height="4" rx="2" fill="var(--accent)" stroke="none"/>
          <circle id="vknob" cx="0" cy="0" r="5" fill="#fff" stroke="none" style="filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3))"/>
          <text id="vpct" x="44" y="20" text-anchor="middle" font-size="10" fill="var(--gray)" stroke="none" font-family="Geist Mono, ui-monospace, monospace">0%</text>
        </g>
      </g>
    </svg>
    <div class="term" id="termwrap" aria-label="What the terminal shows" aria-live="polite"><span class="cur" id="cur" aria-hidden="true"></span></div>
  </div>

  <svg class="tree" id="tree" viewBox="0 0 640 96" fill="none" stroke-linecap="round" aria-label="Where you are: working, 90 minutes, the ball turns, the ask, then either pause and type again, or keep working and let it go">
    <defs><clipPath id="clip"><rect id="cliprect" x="0" y="0" width="0" height="96"/></clipPath></defs>
    <path id="pA" d="M30 48 H330 C 352 48, 352 24, 374 24 H604" stroke="var(--faint)" stroke-width="1"/>
    <path id="pB" d="M330 48 C 352 48, 352 72, 374 72 H604" stroke="var(--faint)" stroke-width="1"/>
    <g clip-path="url(#clip)"><path id="act" stroke="var(--accent)" stroke-width="1.5"/></g>
    <g id="nodes"></g>
  </svg>

  <span id="line" hidden></span>
<script>{const q=new URLSearchParams(location.search);if(q.get("tree")==="0")document.getElementById("tree").style.display="none";if(q.get("compact")==="1"){document.getElementById("termwrap").style.display="none";document.querySelector(".panel svg").setAttribute("viewBox",innerWidth<560?"86 50 468 166":"0 52 640 160")}}</script>
</main>
<script>
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const fl=[];for(let i=0;i<6;i++)fl.push(mk('circle',{r:1.6},$('flecks')));
// Scenes: [start s, light, motion, music, text, cursor, branch-node index]
const COMMON=[[0,0,0,0,'Working.',1,0],[4,1,0,0,'90 minutes. The lamp comes on.',0,1],[8.5,1,1,0,'The ball starts to turn.',0,2],[12,1,1,0,'Will you take a moment?',0,3]];
const A=[...COMMON,[16.5,1,1,1,'I pause. Music.',0,4],[21,0,0,0,'I type again. The room lets it go.',1,5],[25.5,0,0,0,'',0,-1]];
const B=[...COMMON,[16.5,0,0,0,'I keep working.',1,6],[21,0,0,0,'No guilt either way.',1,7],[25.5,0,0,0,'',0,-1]];
const LOOP=28, FADE=2.2;
const LOGA=[['<span class="p">~ %</span> room_tone','✦ room_tone: noticing','⏱ work threshold: 90 minutes'],['▸ 90 minutes: activating','● light on'],['◐ ball moving'],['… will you take a moment to pause?'],['✔ pause detected: music starting','♪ music on'],['♩ returning','· room settles','✧ notice again? (y/n)'],[]];
const LOGB=[...LOGA.slice(0,4),['♩ returning'],['· room settles','✧ notice again? (y/n)'],[]];
let lastKey='',held=false;let logged=-1,logLoop=-1;
function log(lines){const T=$('termwrap');lines.forEach((h,i)=>setTimeout(()=>{T.querySelectorAll('div.in').forEach(d=>d.classList.add('old'));const d=document.createElement('div');d.innerHTML=h;T.insertBefore(d,$('cur'));requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('in')));const ls=T.querySelectorAll('div');for(let q=0;q<ls.length-5;q++)ls[q].remove()},i*900))}
// node positions: trunk then A branch (up) then B branch (down)
const N=[[30,48,'Working','b'],[130,48,'90 min','b'],[230,48,'Ball turns','b'],[330,48,'The ask','b'],[440,24,'Pause','t'],[590,24,'Type again','t'],[440,72,'Keep working','b'],[590,72,'Lets it go','b']];
const TX=[[0,30],[4,130],[8.5,230],[12,330],[16.5,440],[21,590],[25.5,604]];
const jumps=[];const nodes=N.map(([x,y,l,pos],i)=>{const g=mk('g',{class:'hit',tabindex:0,role:'button','aria-label':'Jump to '+l},$('nodes'));
  const c=mk('circle',{cx:x,cy:y,r:4,fill:'var(--bg)',stroke:'var(--gray)','stroke-width':1},g);
  const t=mk('text',{x,y:pos==='t'?y-11:y+19,'text-anchor':'middle',class:(i===5||i===7)?'end':''},g);t.textContent=l;
  const go=()=>{const branch=i>=6?1:(i>=4?0:loop%2);const sc=(branch?B:A).find(s=>s[6]===i);loop=branch;logLoop=-1;t0=performance.now()-(sc[0]+.05)*1000;};
  g.addEventListener('click',go);jumps[i]=go;g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});return{c,t}});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lv={l:0,m:0,s:0};let volO=0;let shown=null,t0=performance.now(),last=t0,spin=0,loop=0,lastT=0;
function xAt(t){for(let i=1;i<TX.length;i++)if(t<=TX[i][0]){const[a,xa]=TX[i-1],[b,xb]=TX[i];return xa+(xb-xa)*(t-a)/(b-a)}return 604}
function frame(now){
  if(held)t0+=now-last;
  const dt=Math.min((now-last)/1000,.1);last=now;
  let t=(now-t0)/1000;if(t>=LOOP){t0=now;t=0;loop=0;logLoop=-1}
  const S=loop%2?B:A;let cur=S[0];for(const s of S)if(t>=s[0])cur=s;
  // ease levels; on the way out, layers leave in reverse with a beat between
  const k=dt/FADE, outAt=S[4][1]===0?16.5:21;
  const go=(key,to,delay)=>{if(to===0&&t>=outAt&&t<outAt+delay)return;lv[key]+=Math.sign(to-lv[key])*Math.min(Math.abs(to-lv[key]),k)};
  {const ks=dt/4.5;const to=cur[3];if(!(to===0&&t<outAt))lv.s+=Math.sign(to-lv.s)*Math.min(Math.abs(to-lv.s),ks)}go('m',cur[2],1.2);go('l',cur[1],2.4);
  $('glow').setAttribute('opacity',lv.l);
  spin+=dt*.35*lv.m;$('m1').setAttribute('rx',Math.abs(Math.cos(spin))*26);$('m2').setAttribute('rx',Math.abs(Math.sin(spin))*26);
  $('flecks').setAttribute('opacity',lv.m*.6);fl.forEach((c,i)=>{const a=spin+i*1.05;c.setAttribute('cx',Math.cos(a)*48);c.setAttribute('cy',Math.sin(a)*14+44)});
  {const v=lv.s*lv.s*(3-2*lv.s);$('vfill').setAttribute('width',(88*v).toFixed(1));$('vknob').setAttribute('cx',(88*v).toFixed(1));$('vpct').textContent=Math.round(v*100)+'%';
   const want=lv.s>0.003?1:0;volO+=Math.sign(want-volO)*Math.min(Math.abs(want-volO),dt/(want?0.8:1.6));$('volg').setAttribute('opacity',volO.toFixed(3))}
  // tree
  $('act').setAttribute('d',loop%2?'M30 48 H330 C 352 48, 352 72, 374 72 H604':'M30 48 H330 C 352 48, 352 24, 374 24 H604');
  $('cliprect').setAttribute('width',xAt(t)+2);
  const active=new Set(S.filter(s=>t>=s[0]&&s[6]>=0).map(s=>s[6]));
  nodes.forEach((n,i)=>{const on=i===cur[6];const done=active.has(i);
    n.c.setAttribute('fill',on?'var(--accent)':done?'var(--accent)':'var(--bg)');n.c.setAttribute('stroke',done||on?'var(--accent)':'var(--gray)');n.c.setAttribute('r',on?4.5:3.5);
    n.t.classList.toggle('on',on)});
  $('cur').classList.toggle('on',!!cur[5]);
  const si=S.indexOf(cur);
  if(loop!==logLoop){logLoop=loop;logged=-1;$('termwrap').querySelectorAll('div').forEach(d=>d.remove())}
  if(si>logged){for(let j=logged+1;j<=si;j++)log((loop%2?LOGB:LOGA)[j]);logged=si}
  {const ix=cur[6];const row=ix<0?6:[0,1,2,2,3,4,5,6][ix];const br=t<16.5?-1:loop%2;const key=row+':'+br;
   if(key!==lastKey){lastKey=key;parent.postMessage({rtStage:row,branch:br},'*')}}
  if(cur[4]!==shown){shown=cur[4];$('line').textContent=shown}
  requestAnimationFrame(frame);
}
if(reduce){$('volg').setAttribute('opacity',1);$('vfill').setAttribute('width',53);$('vknob').setAttribute('cx',53);$('vpct').textContent='60%';$('glow').setAttribute('opacity',1);$('flecks').setAttribute('opacity',.6);$('line').textContent='After 90 minutes the room asks: will you take a moment? Pause, and music plays. Keep working, and it lets it go.';$('cliprect').setAttribute('width',640);$('termwrap').insertAdjacentHTML('afterbegin',['▸ 90 minutes: activating','● light on','◐ ball moving','… will you take a moment to pause?','✔ pause detected: music starting'].map(l=>'<div class="in">'+l+'</div>').join(''))}
else requestAnimationFrame(frame);
addEventListener('message',e=>{const d=e.data||{};if('rtHold' in d)held=!!d.rtHold;const r=d.rtJump;if(r==null)return;const n=[0,1,2,4,5,6,7][r];jumps[n]&&jumps[n]()});
function report(){parent.postMessage({rtLayersH:document.querySelector('main').offsetHeight},'*')}addEventListener('load',report);addEventListener('resize',report);setTimeout(report,300);
</script>
</body></html>
