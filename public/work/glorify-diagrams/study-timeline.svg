<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="study-timeline-title study-timeline-desc" id="study-timeline-root">
      <title id="study-timeline-title">Who was still checking in</title>
      <desc id="study-timeline-desc">Over a two-week pilot, 82 participants were asked to complete six diary check-ins. Completion went from 78% at check-in 1 to 65% at check-in 6.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #study-timeline-root { --paper: #FFFFFF; --ink: #141414; --muted: #6E6E6B; --soft: #6E6E6B; --accent: #002BBA; --accent-tint: rgba(0,43,186,0.14); --sans: 'Instrument Sans', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace; }
      #study-timeline-root { color: var(--ink); font-family: var(--sans); }
      #study-timeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #study-timeline-root .name { fill: var(--ink); font: 500 14px var(--sans); }
      #study-timeline-root .sub { fill: var(--soft); font: 400 12px var(--sans); }
      #study-timeline-root .val { fill: var(--muted); font: 500 13px var(--sans); }
      #study-timeline-root .val.focal { fill: var(--accent); font-weight: 500; }
      #study-timeline-root .tick { fill: var(--soft); font: 400 11px var(--mono); }</style>
  </defs>
      <rect width="960" height="420" fill="#FFFFFF"/>
      <line x1="64" y1="72" x2="896" y2="72" stroke="#6E6E6B" stroke-width="1" stroke-dasharray="5 4"/>
      <text x="64" y="60" class="sub">82 people started</text>
      <rect x="102.0" y="126.4" width="36" height="193.6" fill="#FFFFFF"/>
      <rect x="102.0" y="126.4" width="36" height="193.6" fill="#6e6e6b" stroke="#6E6E6B" stroke-width="1" fill-opacity="0.15"/>
      <text x="120.0" y="116.4" class="val" text-anchor="middle">78%</text>
      <text x="120.0" y="344" class="name" text-anchor="middle">1</text>
      <rect x="162.0" y="138.5" width="36" height="181.5" fill="#FFFFFF"/>
      <rect x="162.0" y="138.5" width="36" height="181.5" fill="#6e6e6b" stroke="#6E6E6B" stroke-width="1" fill-opacity="0.15"/>
      <text x="180.0" y="128.5" class="val" text-anchor="middle">73%</text>
      <text x="180.0" y="344" class="name" text-anchor="middle">2</text>
      <rect x="282.0" y="144.6" width="36" height="175.4" fill="#FFFFFF"/>
      <rect x="282.0" y="144.6" width="36" height="175.4" fill="#6e6e6b" stroke="#6E6E6B" stroke-width="1" fill-opacity="0.15"/>
      <text x="300.0" y="134.6" class="val" text-anchor="middle">71%</text>
      <text x="300.0" y="344" class="name" text-anchor="middle">3</text>
      <rect x="462.0" y="150.6" width="36" height="169.4" fill="#FFFFFF"/>
      <rect x="462.0" y="150.6" width="36" height="169.4" fill="#6e6e6b" stroke="#6E6E6B" stroke-width="1" fill-opacity="0.15"/>
      <text x="480.0" y="140.6" class="val" text-anchor="middle">68%</text>
      <text x="480.0" y="344" class="name" text-anchor="middle">4</text>
      <rect x="582.0" y="171.8" width="36" height="148.2" fill="#FFFFFF"/>
      <rect x="582.0" y="171.8" width="36" height="148.2" fill="#6e6e6b" stroke="#6E6E6B" stroke-width="1" fill-opacity="0.15"/>
      <text x="600.0" y="161.8" class="val" text-anchor="middle">60%</text>
      <text x="600.0" y="344" class="name" text-anchor="middle">5</text>
      <rect x="702.0" y="159.7" width="36" height="160.3" fill="#FFFFFF"/>
      <rect x="702.0" y="159.7" width="36" height="160.3" fill="#002bba" stroke="#002BBA" stroke-width="1" fill-opacity="0.16"/>
      <text x="720.0" y="149.7" class="val focal" text-anchor="middle">65%</text>
      <text x="720.0" y="344" class="name" text-anchor="middle">6</text>
      <line x1="120.0" y1="320" x2="120.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <line x1="180.0" y1="320" x2="180.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <line x1="240.0" y1="320" x2="240.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <line x1="300.0" y1="320" x2="300.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <line x1="360.0" y1="320" x2="360.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <line x1="420.0" y1="320" x2="420.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <line x1="480.0" y1="320" x2="480.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <line x1="540.0" y1="320" x2="540.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <line x1="600.0" y1="320" x2="600.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <line x1="660.0" y1="320" x2="660.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <line x1="720.0" y1="320" x2="720.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <line x1="780.0" y1="320" x2="780.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <line x1="840.0" y1="320" x2="840.0" y2="325" stroke="#141414" stroke-opacity="0.35"/>
      <text x="120.0" y="368" class="sub" text-anchor="middle">Day 1</text>
      <text x="480.0" y="368" class="sub" text-anchor="middle">Day 7</text>
      <text x="840.0" y="368" class="sub" text-anchor="middle">Day 13</text>
      <line x1="64" y1="320" x2="896" y2="320" stroke="#141414" stroke-opacity="0.35"/>
      <text x="840.0" y="308" class="sub" text-anchor="middle">Pilot ends</text>
      <text x="92" y="344" class="sub" text-anchor="end">Check-in</text>
    </svg>
