<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="survey-results-title survey-results-desc" id="survey-results-root">
      <title id="survey-results-title">What participants said</title>
      <desc id="survey-results-desc">37 of 38 respondents agreed Glorify Groups could enhance their small group, and 44 of 48 said they would likely use it if it were developed further.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #survey-results-root { --paper: #FFFFFF; --ink: #141414; --muted: #6E6E6B; --soft: #6E6E6B; --accent: #002BBA; --accent-tint: rgba(0,43,186,0.14); --sans: 'Instrument Sans', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace; }
      #survey-results-root { color: var(--ink); font-family: var(--sans); }
      #survey-results-root .diagram-container { width: 100%; overflow-x: auto; }
      #survey-results-root .name { fill: var(--ink); font: 500 14px var(--sans); }
      #survey-results-root .sub { fill: var(--soft); font: 400 12px var(--sans); }
      #survey-results-root .val { fill: var(--muted); font: 500 13px var(--sans); }
      #survey-results-root .val.focal { fill: var(--accent); font-weight: 500; }
      #survey-results-root .tick { fill: var(--soft); font: 400 11px var(--mono); }</style>
  </defs>
      <rect width="960" height="260" fill="#FFFFFF"/>
      <text x="48" y="56" class="name">Glorify Groups can enhance my small group</text>
      <text x="912" y="56" class="val focal" text-anchor="end">37 of 38</text>
      <rect x="48" y="72" width="864" height="24" rx="2" fill="#6e6e6b" fill-opacity="0.10"/>
      <rect x="48" y="72" width="841.3" height="24" rx="2" fill="#002bba" stroke="#002BBA" stroke-width="1" fill-opacity="0.16"/>
      <text x="48" y="118" class="sub">agree or strongly agree</text>
      <text x="48" y="168" class="name">I'd use it if it were developed further</text>
      <text x="912" y="168" class="val" text-anchor="end">44 of 48</text>
      <rect x="48" y="184" width="864" height="24" rx="2" fill="#6e6e6b" fill-opacity="0.10"/>
      <rect x="48" y="184" width="792.0" height="24" rx="2" fill="#6e6e6b" stroke="#6E6E6B" stroke-width="1" fill-opacity="0.18"/>
      <text x="48" y="230" class="sub">likely or very likely</text>
    </svg>
