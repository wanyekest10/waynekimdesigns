<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flywheel-title flywheel-desc" id="flywheel-root">
      <title id="flywheel-title">The Glorify Groups flywheel</title>
      <desc id="flywheel-desc">Value flows clockwise from group leads to members, the small group, deeper engagement, more meaningful time in person, and growing discipleship, then back to leads. Each step strengthens Glorify Groups as an intentional, safe space for faith.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #flywheel-root { --paper: #FFFFFF; --ink: #141414; --muted: #6E6E6B; --soft: #6E6E6B; --accent: #002BBA; --accent-tint: rgba(0,43,186,0.10); --sans: 'Instrument Sans', system-ui, sans-serif; }
      #flywheel-root { color: var(--ink); font-family: var(--sans); }
      #flywheel-root .diagram-container { width: 100%; overflow-x: auto; }
      #flywheel-root .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #flywheel-root .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
      #flywheel-root .station { fill: #FFFFFF; stroke: var(--ink); stroke-width: 1; }
      #flywheel-root .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #flywheel-root .hub { fill: var(--ink); }
      #flywheel-root .node-name { fill: var(--ink); font: 500 16px var(--sans); text-anchor: middle; }
      #flywheel-root .focal-name { fill: var(--accent); }
      #flywheel-root .sublabel { fill: var(--soft); font: 400 13px var(--sans); text-anchor: middle; }
      #flywheel-root .hub-name { fill: var(--paper); font: 500 19px var(--sans); text-anchor: middle; }
      #flywheel-root .hub-sub { fill: var(--paper); opacity: 0.78; font: 400 13px var(--sans); text-anchor: middle; }</style>
        <marker id="flywheel-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6E6E6B"/></marker>
        <marker id="flywheel-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6E6E6B"/></marker>
      </defs>
      <rect width="1040" height="680" fill="#FFFFFF"/>
      <path class="ring" d="M612.000 118.334 A240 240 0 0 1 701.602 183.090" marker-end="url(#flywheel-arrow)"/>
      <path class="ring" d="M743.285 252.000 A240 240 0 0 1 745.237 422.875" marker-end="url(#flywheel-arrow)"/>
      <path class="ring" d="M705.731 492.000 A240 240 0 0 1 613.107 561.204" marker-end="url(#flywheel-arrow)"/>
      <path class="ring" d="M428.000 561.666 A240 240 0 0 1 335.031 492.927" marker-end="url(#flywheel-arrow)"/>
      <path class="ring" d="M295.180 424.000 A240 240 0 0 1 296.278 253.118" marker-end="url(#flywheel-arrow)"/>
      <path class="ring" d="M337.616 184.000 A240 240 0 0 1 426.893 118.796" marker-end="url(#flywheel-arrow)"/>
      <path class="spoke" d="M520.0 132.0 L520.0 280.0" marker-end="url(#flywheel-arrow-soft)"/>
      <path class="spoke" d="M669.1 252.0 L618.7 283.0" marker-end="url(#flywheel-arrow-soft)"/>
      <path class="spoke" d="M669.1 424.0 L618.7 397.0" marker-end="url(#flywheel-arrow-soft)"/>
      <path class="spoke" d="M520.0 544.0 L520.0 400.0" marker-end="url(#flywheel-arrow-soft)"/>
      <path class="spoke" d="M370.9 424.0 L421.3 397.0" marker-end="url(#flywheel-arrow-soft)"/>
      <path class="spoke" d="M370.9 252.0 L421.3 283.0" marker-end="url(#flywheel-arrow-soft)"/>
      <rect class="station" x="428" y="64" width="184" height="68" rx="6"/>
      <text x="520" y="91" class="node-name">Group leads</text><text x="520" y="111" class="sublabel">prompt engagement</text>
      <rect class="station" x="636" y="184" width="184" height="68" rx="6"/>
      <text x="728" y="211" class="node-name">Group members</text><text x="728" y="231" class="sublabel">share faith and life</text>
      <rect class="station" x="636" y="424" width="184" height="68" rx="6"/>
      <text x="728" y="451" class="node-name">Small group</text><text x="728" y="471" class="sublabel">value to the group</text>
      <rect class="station" x="428" y="544" width="184" height="68" rx="6"/>
      <text x="520" y="571" class="node-name">Engagement</text><text x="520" y="591" class="sublabel">deeper, better quality</text>
      <rect class="station focal" x="220" y="424" width="184" height="68" rx="6"/>
      <text x="312" y="451" class="node-name focal-name">Time in person</text><text x="312" y="471" class="sublabel">made more meaningful</text>
      <rect class="station" x="220" y="184" width="184" height="68" rx="6"/>
      <text x="312" y="211" class="node-name">Discipleship</text><text x="312" y="231" class="sublabel">supported and growing</text>
      <rect class="hub" x="396" y="286" width="248" height="108" rx="8"/>
      <text x="520" y="336" class="hub-name">Glorify Groups</text><text x="520" y="360" class="hub-sub">an intentional, safe space for faith</text>
    </svg>
