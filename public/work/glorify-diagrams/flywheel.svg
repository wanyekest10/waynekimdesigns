<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fw-title fw-desc">
  <title id="fw-title">The Glorify Groups flywheel: two wheels</title>
  <desc id="fw-desc">An inner wheel, value to users, where group leads and group members drive each other. It turns an outer wheel, value to the small group: increased quality of engagement, making time in person more meaningful, and supporting discipleship, which loops back to more value for the group.</desc>
  <defs>
    <style>
      text { font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #141414; }
      .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 15px; letter-spacing: 1px; fill: #6E6E6B; }
      .big { font-size: 26px; font-weight: 500; }
      .lbl { font-size: 22px; }
      .focal { fill: #002BBA; }
      .arc { fill: none; stroke: #6E6E6B; stroke-width: 2; }
      .arc-in { fill: none; stroke: #141414; stroke-width: 2; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6E6E6B"/></marker>
    <marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141414"/></marker>
  </defs>

  <!-- Outer wheel: value to the small group -->
  <text class="mono" x="520" y="44" text-anchor="middle">OUTER WHEEL</text>
  <text class="big" x="520" y="80" text-anchor="middle">Value to the small group</text>

  <text class="lbl" x="150" y="290" text-anchor="middle">Increased quality</text>
  <text class="lbl" x="150" y="320" text-anchor="middle">of engagement</text>

  <text class="lbl focal" x="520" y="580" text-anchor="middle">Making time in person more meaningful</text>

  <text class="lbl" x="890" y="305" text-anchor="middle">Supporting discipleship</text>

  <!-- outer arrows, counterclockwise: top to left, left to bottom, bottom to right, right to top -->
  <path class="arc" d="M 400 92 Q 230 120 165 255" marker-end="url(#ah)"/>
  <path class="arc" d="M 165 345 Q 210 500 330 552" marker-end="url(#ah)"/>
  <path class="arc" d="M 710 552 Q 840 500 880 335" marker-end="url(#ah)"/>
  <path class="arc" d="M 880 275 Q 820 120 640 92" marker-end="url(#ah)"/>

  <!-- Inner wheel: value to users -->
  <rect x="330" y="180" width="380" height="250" rx="22" fill="#F4F4F2" stroke="#E6E6E3"/>
  <text class="mono" x="520" y="222" text-anchor="middle">INNER WHEEL</text>
  <text class="big" x="520" y="256" text-anchor="middle">Value to users</text>
  <text class="lbl" x="425" y="345" text-anchor="middle">Group leads</text>
  <text class="lbl" x="615" y="345" text-anchor="middle">Group members</text>
  <path class="arc-in" d="M 450 315 Q 520 285 590 315" marker-end="url(#ahk)"/>
  <path class="arc-in" d="M 590 370 Q 520 400 450 370" marker-end="url(#ahk)"/>
</svg>
