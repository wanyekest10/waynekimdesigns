<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dear Theo, Ever Yours, live</title>
<meta name="robots" content="noindex">
<style>
  /* Dear Theo, Ever Yours: type Van Gogh's words about a painting, and the painting is laid down as a mosaic. */
  @font-face { font-family: 'Instrument Sans'; src: url('/fonts/instrument-sans-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Instrument Sans'; src: url('/fonts/instrument-sans-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
  @font-face { font-family: 'Geist Mono'; src: url('/fonts/geist-mono-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
  :root { --ink:#141414; --gray:#6E6E6B; --faint:#B4B4AF; --rule:#E6E6E3; --paper:#FFFFFF; --accent:#002BBA; --miss:#C8402F;
    --sans:"Instrument Sans", system-ui, sans-serif; --mono:"Geist Mono", ui-monospace, monospace; color-scheme: light; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:400 16px/1.5 var(--sans); }
  .app { height:100%; display:flex; flex-direction:column; gap:10px; padding:0; box-sizing:border-box; }
  .stage { position:relative; flex:1 1 auto; min-height:180px; background:#F0EEE8; border-radius:6px; overflow:hidden; cursor:text; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* 16px stops iOS from zooming in on focus; parked at the bottom so the browser doesn't scroll to the top of the frame */
  #keys { position:absolute; left:0; bottom:0; width:1px; height:1px; opacity:0; border:0; padding:0; font-size:16px; }
  /* colour words picked out in the passage, and the palette they leave behind */
  .prompt span.hue { color:var(--ink); background:var(--h); box-shadow:none; transition:background .4s; }
  .palette { display:none; flex-wrap:wrap; gap:6px; min-height:24px; }
  .passage .palette { display:flex; }
  .palette span { display:inline-flex; align-items:center; gap:6px; font:400 12px/1 var(--mono); color:var(--gray); padding:4px 8px 4px 4px; border:1px solid var(--rule); border-radius:999px; animation:chip .5s ease-out both; }
  .palette i { width:14px; height:14px; border-radius:50%; background:var(--h); display:block; }
  @keyframes chip { from { opacity:0; transform:translateY(4px); } }
  /* phones, while the keyboard is up: the frame fills what's left of the screen; painting on top, the line you're typing just above the keys */
  #done { display:none; }
  .mob .app { gap:6px; padding:8px 12px 6px; }
  .mob .strip, .mob #who, .mob #stats, .mob #letters, .mob #next, .mob #view, .mob .palette { display:none !important; }
  .mob .stage { min-height:0; }
  .mob .prompt { font-size:15px; min-height:0; max-height:6.6em; }
  .mob .meta { gap:6px 12px; }
  .mob #done { display:inline-block; }
  .strip { display:flex; gap:8px; overflow-x:auto; flex:0 0 auto; }
  .strip button { padding:0; border:2px solid transparent; border-radius:3px; background:none; line-height:0; opacity:.55; flex:0 0 auto; cursor:pointer; }
  .strip button:hover { opacity:.9; border-color:var(--rule); }
  .strip button[aria-current="true"] { opacity:1; border-color:var(--ink); }
  .strip img { height:40px; width:auto; display:block; border-radius:1px; }
  .type { flex:0 0 auto; display:grid; gap:8px; cursor:text; }
  .prompt { font:400 clamp(16px,2.1vw,21px)/1.45 var(--sans); margin:0; position:relative; overflow:hidden; max-height:10.5em; }
  .prompt .sal, .prompt .sig { color:var(--faint); transition:color .5s; }
  .prompt .sal { margin-bottom:.3em; }
  .prompt .sig { margin-top:.3em; }
  .prompt .sig.on { color:var(--ink); }
  @media (max-width:640px) { .prompt { font-size:15px; max-height:9em; } }
  .prompt span { color:var(--faint); transition:color .12s; }
  .prompt span.ok { color:var(--ink); }
  .prompt span.cur { box-shadow:inset 0 -2px 0 var(--accent); color:var(--gray); }
  .prompt span.miss { color:var(--miss); box-shadow:inset 0 -2px 0 var(--miss); }
  .prompt.idle span.cur { animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { box-shadow:none; } }
  @media (prefers-reduced-motion: reduce) { .prompt.idle span.cur { animation:none; } }
  .meta { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; font:400 12px/1.4 var(--mono); color:var(--gray); }
  .meta .spacer { flex:1; }
  .painting { font:500 14px/1.4 var(--sans); color:var(--ink); }
  button.pill { font:500 13px/1.4 var(--sans); cursor:pointer; border-radius:999px; padding:6px 12px; border:1px solid var(--rule); background:var(--paper); color:var(--ink); }
  button.pill[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--paper); }
  button.pill:hover { border-color:var(--ink); }
  button:focus-visible, #keys:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .hint { position:absolute; left:12px; top:10px; font:400 12px/1.4 var(--mono); color:var(--gray); pointer-events:none; transition:opacity .4s; }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="A mosaic of a Van Gogh painting that fills in as you type his words about it"></canvas>
    <p class="hint" id="hint">Click here and start typing</p>
    <input id="keys" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the passage">
  </div>
  <div class="strip" id="strip" role="group" aria-label="Choose a painting"></div>
  <div class="type" id="type">
    <p class="prompt idle" id="prompt" aria-live="polite"></p>
    <div class="palette" id="palette" aria-label="Colors you've named so far"></div>
    <div class="meta">
      <span class="painting" id="painting"></span>
      <span id="who"></span>
      <span class="spacer"></span>
      <span id="stats"></span>
      <button class="pill" id="letters" aria-pressed="true">Color notes</button>
      <button class="pill" id="view" hidden>See the mosaic</button>
      <button class="pill" id="next">Next painting</button>
      <button class="pill" id="done">Done</button>
    </div>
  </div>
</div>
<script>
(() => {
const IMG={'1-starry-night':'/work/dear-theo-assets/starry-night.webp','2-starry-night-over-the-rhone':'/work/dear-theo-assets/rhone.webp','5-the-bedroom':'/work/dear-theo-assets/bedroom.webp','6-sunflowers':'/work/dear-theo-assets/sunflowers.webp','7-wheatfield-with-crows':'/work/dear-theo-assets/wheatfield.webp'};
const PAINTINGS=[
 {img:'5-the-bedroom', title:'The Bedroom', year:'1888', who:'to Theo · Arles, 16 October 1888',
  lines:["The walls are pale violet. The floor is of red tiles.","The wood of the bed and chairs is the yellow of fresh butter,","In a word, looking at the picture ought to rest the brain, or rather the imagination."]},
 {img:'1-starry-night', title:'The Starry Night', year:'1889', who:'to Theo · Saint-Rémy, June 1889',
  lines:["This morning I saw the countryside from my window a long time before sunrise, with nothing but the morning star, which looked very big."]},
 {img:'7-wheatfield-with-crows', title:'Wheatfield with Crows', year:'1890', who:'to Theo and Jo · Auvers, July 1890',
  lines:["They are vast stretches of corn under troubled skies,","I did not have to go out of my way very much in order to try to express sadness and extreme loneliness.","I'm fairly sure that these canvases will tell you what I cannot say in words."]},
 {img:'6-sunflowers', title:'Sunflowers', year:'1888', who:'to Theo · Arles, August 1888',
  lines:["I am hard at it, painting with the enthusiasm of a Marseillais eating bouillabaisse,","which won't surprise you when you know that what I'm at is the painting of some sunflowers."]},
 {img:'2-starry-night-over-the-rhone', title:'Starry Night Over the Rhône', year:'1888', who:'to Theo · Arles, July 1888',
  lines:["But to look at the stars always makes me dream, as simply as I dream over the black dots of a map representing towns and villages.","Why, I ask myself, should the shining dots of the sky not be as accessible as the black dots on the map of France?"]}
];
// words that name a colour or a thing in the picture, and the colour to look for
const HUE={SUNFLOWERS:'#e3b13a',BOUILLABAISSE:'#d77a33',RED:'#b3322b',GREEN:'#2f6e45',NIGHT:'#1d2b5e',COLOURED:'#e2a93b',DAY:'#e9cc6a',
 AQUAMARINE:'#3f8e9b',ROYAL:'#24429c',BLUE:'#24429c',WATER:'#1f3b85',MAUVE:'#6f5a86',STARS:'#efe39a',VIOLET:'#8f8fc4',TILES:'#b8643c',
 YELLOW:'#e7bf45',BUTTER:'#edcf63',WOOD:'#d49a3d',BED:'#d49a3d',CHAIRS:'#d6a948',WALLS:'#8f9ac8',FLOOR:'#b8643c',
 STAR:'#f3efd2',SKY:'#24429c',COUNTRYSIDE:'#3c5f6a',WINDOW:'#9cb6d6',CORN:'#d6a33b',SKIES:'#22336f',TROUBLED:'#1c2850'};
const SPELL={};
// each colour word paints its part of the picture (default). Other versions kept for reference:
// ?mode=tiles (word spelled in tiles only) | passage (word marked in the line + a palette) | all
const MODE=new URLSearchParams(location.search).get('mode')||'paint';
const PASSAGE=MODE==='passage'||MODE==='all', PAINT=MODE==='paint'||MODE==='all';
if(PASSAGE) document.documentElement.classList.add('passage');

function hex(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function css(c,a){return a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;}
function lum(c){return (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255;}
function hash(i){const x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x);}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;   // ease in and out
const sharp=document.createElement('canvas');
const PAPER=[240,238,232], BLACK=[0,0,0], WHITE=[255,255,255];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- mosaic ----------
let W=1000, H=800;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
let scale=1, ts=9, cols=0, rows=0;
let readyAt=0, place=null, painting=0, showPainting=true, col=null, inside=null, rank=null, nInside=0, jitter=null;
const images={};
function loadImages(){ return Promise.all(Object.entries(IMG).map(([k,src])=>new Promise(res=>{ const im=new Image(); im.onload=()=>{images[k]=im;res();}; im.onerror=res; im.src=src; }))); }
function buildPainting(){
  const im=images[current.img]; if(!im) return;
  const pad=0.03, bw=W*(1-2*pad), bh=H*(1-2*pad), k=Math.min(bw/im.width,bh/im.height);
  const w=im.width*k, h=im.height*k, x0=(W-w)/2, y0=(H-h)/2; place={x0,y0,w,h};
  const c=document.createElement('canvas'); c.width=cols; c.height=rows; const g=c.getContext('2d',{willReadFrequently:true});
  g.imageSmoothingQuality='high'; g.drawImage(im,x0/ts,y0/ts,w/ts,h/ts);
  const d=g.getImageData(0,0,cols,rows).data;
  col=new Float32Array(cols*rows*3); inside=new Uint8Array(cols*rows); nInside=0;
  for(let i=0;i<cols*rows;i++){ const cx=(i%cols+0.5)*ts, cy=(Math.floor(i/cols)+0.5)*ts;
    if(cx>x0+ts*0.3 && cx<x0+w-ts*0.3 && cy>y0+ts*0.3 && cy<y0+h-ts*0.3){ inside[i]=1; nInside++; }
    const j=0.94+hash(i*1.37)*0.12; col[i*3]=d[i*4]*j; col[i*3+1]=d[i*4+1]*j; col[i*3+2]=d[i*4+2]*j; }
  // tiles go down in organic patches, a section at a time
  const key=[], seed=hash(pi*7.7)*10;
  for(let i=0;i<cols*rows;i++){ if(!inside[i]) continue; const x=(i%cols)/cols, y=Math.floor(i/cols)/rows;
    const nz=0.5+0.25*Math.sin(x*8.3+seed+Math.sin(y*6.1+seed)*2.2)+0.25*Math.sin(y*7.1-seed+Math.cos(x*5.3)*2.0);
    key.push([nz*0.75+hash(i*0.913+seed)*0.35,i]); }
  key.sort((a,b)=>a[0]-b[0]);
  rank=new Float32Array(cols*rows).fill(1e9); key.forEach(([,i],r)=>rank[i]=r);
  MASKS.length=0; for(const p of PAINTED) MASKS.push(maskFor(p.w,p.t0));
}

// ---------- paint: a colour word fills in the part of the picture closest to that colour ----------
const PAINTED=[], MASKS=[];
function maskFor(word,t0){
  const t=hex(HUE[word]), m=new Float32Array(cols*rows), ds=[];
  for(let i=0;i<cols*rows;i++){ if(!inside[i]) continue; const o=i*3; const d=Math.sqrt((col[o]-t[0])**2+(col[o+1]-t[1])**2+(col[o+2]-t[2])**2); m[i]=d; ds.push(d); }
  ds.sort((a,b)=>a-b); const thr=Math.min(160,Math.max(60,ds[Math.floor(ds.length*0.14)]||60));
  for(let i=0;i<cols*rows;i++){ if(!inside[i]){ m[i]=0; continue; } m[i]=Math.min(1,Math.max(0,(1-m[i]/thr)*2.2)); }
  return {m,t0,rgb:t};
}
function paintWord(word,now){ if(PAINTED.some(p=>p.w===word)) return; PAINTED.push({w:word,t0:now}); if(col) MASKS.push(maskFor(word,now)); }
function resize(){
  const dpr=window.devicePixelRatio||1, w=stage.clientWidth, h=stage.clientHeight;
  H=Math.round(W*h/Math.max(1,w)); scale=w/W; cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  ts=Math.max(8.4,6.2/scale); cols=Math.ceil(W/ts); rows=Math.ceil(H/ts);
  buildPainting(); LABELS.length=0;
}

// ---------- colour notes ----------
const LABELS=[];
function placeLabel(word,now){
  const target=HUE[word]; if(!target||!col) return;
  const t=hex(target), text=SPELL[word]||word, span=text.length*2;
  const cand=[];
  for(let r0=1;r0<rows-3;r0+=1) for(let c0=1;c0<cols-span-1;c0+=2){
    const i=r0*cols+c0, j=i+span-1; if(!inside[i]||!inside[j]||!inside[i+cols*2]) continue;
    const o=(r0*cols+c0+Math.floor(span/2))*3, dd=(col[o]-t[0])**2+(col[o+1]-t[1])**2+(col[o+2]-t[2])**2;
    cand.push([dd,r0,c0]); }
  cand.sort((a,b)=>a[0]-b[0]);
  const pool=cand.slice(0,40).map(c=>[hash(now*0.37+c[1]*3.1+c[2]),c]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
  for(const [,r0,c0] of pool){
    if(LABELS.some(L=>!L.out && Math.abs(L.row-r0)<3 && c0<L.col+L.t.length*2+2 && c0+span+2>L.col)) continue;
    LABELS.push({w:word,t:text,row:r0,col:c0,t0:now,out:0}); return; }
}

// ---------- typing ----------
const promptEl=document.getElementById('prompt'), whoEl=document.getElementById('who'), statsEl=document.getElementById('stats'), paintingEl=document.getElementById('painting'), stripEl=document.getElementById('strip');
const keys=document.getElementById('keys'), viewBtn=document.getElementById('view');
let pi=0, current=PAINTINGS[0], lineIdx=0, pos=0, line='', spans=[], typed=0, total=0, done=false;
let revealShown=0, sat=0.1, boost=0, ready=false, token=0;
const WORDCH=/[A-Za-zÀ-ÿ'’]/;
// you only type the letters: spaces and punctuation fill themselves in (a space typed out of habit is simply ignored)
const typable=ch=>/[A-Za-zÀ-ÿ0-9]/.test(ch);
let pending=[];
// Phones: fat-finger tolerance. A key touching the right one on a phone keyboard counts as right.
// Rows are staggered like a phone keyboard (second row half a key in, third row a key and a half in),
// so a key touches its two row neighbours and up to two keys above and below. Desktop stays exact.
const NEAR=(()=>{ const rows=['qwertyuiop','asdfghjkl','zxcvbnm'], off=[0,0.5,1.5], pos={}, m={};
  rows.forEach((r,y)=>[...r].forEach((c,i)=>pos[c]=[i+off[y],y]));
  for(const a in pos){ m[a]=new Set(); for(const b in pos){ if(a===b) continue; const dx=Math.abs(pos[a][0]-pos[b][0]), dy=Math.abs(pos[a][1]-pos[b][1]);
    if((dy===0&&dx===1)||(dy===1&&dx<=1)) m[a].add(b); } }
  return m; })();
const near=(a,b)=>coarse && !!NEAR[b] && NEAR[b].has(a);
const norm=ch=>ch.normalize('NFD').replace(/[̀-ͯ]/g,'').replace('’',"'").toLowerCase();
const clean=t=>t.toUpperCase().replace(/[^A-Z]/g,'');
PAINTINGS.forEach((P,k)=>{ const b=document.createElement('button'); b.type='button'; b.title=P.title; b.setAttribute('aria-label',P.title); const im=document.createElement('img'); im.src=IMG[P.img]; im.alt=''; b.appendChild(im); b.addEventListener('click',()=>{ setPainting(k); focusKeys(); }); stripEl.appendChild(b); });
function setPainting(i){
  pi=(i+PAINTINGS.length)%PAINTINGS.length; current=PAINTINGS[pi];
  lineIdx=0; typed=0; done=false; pending=[]; ready=false; painting=0; showPainting=true; viewBtn.hidden=true; viewBtn.textContent='See the mosaic'; token++; revealShown=0; sat=0.1; boost=0;
  for(const L of LABELS) if(!L.out) L.out=performance.now();
  PAINTED.length=0; MASKS.length=0; paletteEl.textContent='';
  total=joinLines(current.lines).length;
  paintingEl.textContent=current.title+', '+current.year; whoEl.textContent='Vincent '+current.who; statsEl.textContent='';
  [...stripEl.children].forEach((b,k)=>b.setAttribute('aria-current',k===pi));
  buildPainting(); setLine();
}
// The whole passage is on the page at once, between "My dear Theo," and "Ever yours, Vincent." (shown faintly, not written).
// You write the middle; it darkens as you go.
// Where a passage skips part of the letter (a line ends mid-sentence and the next starts a new one), mark the gap with an ellipsis.
const joinLines=ls=>ls.reduce((a,l)=>!a?l:(/,$/.test(a)&&/^[A-Z]/.test(l)?a+' … '+l:a+' '+l),'');
function setLine(){
  line=joinLines(current.lines); pos=0;
  promptEl.textContent='';
  const sal=document.createElement('div'); sal.className='sal'; sal.textContent='My dear Theo,'; promptEl.appendChild(sal);
  const body=document.createElement('div'); body.className='body'; promptEl.appendChild(body);
  spans=[...line].map(ch=>{ const sp=document.createElement('span'); sp.textContent=ch; body.appendChild(sp); return sp; });
  const sig=document.createElement('div'); sig.className='sig'; sig.id='sig'; sig.textContent='Ever yours, Vincent.'; promptEl.appendChild(sig);
  promptEl.scrollTop=0;
  autoFill(); mark();
  // letters typed during the short pause between lines carry over instead of being lost
  const q=pending; pending=[]; for(const c of q) key(c);
}
function autoFill(){ while(pos<line.length && !typable(line[pos])){ spans[pos].className='ok'; pos++; typed++; } }
function mark(){ spans.forEach((sp,i)=>{ if(i===pos) sp.className='cur'; }); const c=spans[pos]; if(c && promptEl.scrollHeight>promptEl.clientHeight+2){ const y=c.offsetTop-promptEl.clientHeight*0.35; promptEl.scrollTop=Math.max(0,y); } }
function wordEndingAt(i){ let a=i; while(a>0 && WORDCH.test(line[a-1])) a--; return line.slice(a,i); }
function key(ch){
  if(done){ if(ready && (ch===' '||ch==='\n')) setPainting(pi+1); return; }
  if(!typable(ch)) return;
  if(pos>=line.length){ pending.push(ch); return; }   // between lines: hold it for the next line
  const want=line[pos];
  if(norm(ch)===norm(want) || near(norm(ch),norm(want))){
    spans[pos].className='ok'; pos++; typed++;
    if(WORDCH.test(want) && (pos>=line.length || !WORDCH.test(line[pos]))){ const w=clean(wordEndingAt(pos)); if(HUE[w]){ boost=Math.min(0.5,boost+0.14); const now=performance.now(); placeLabel(w,now); if(PASSAGE) pickOut(w,pos); if(PAINT) paintWord(w,now); } }
    autoFill();
    if(pos>=line.length) finish();
    mark();
  }else{
    spans[pos].className='miss'; const p=pos; setTimeout(()=>{ if(spans[p] && spans[p].className==='miss') spans[p].className='cur'; },220);
  }
  promptEl.classList.remove('idle'); document.getElementById('hint').style.opacity=0;
}
// passage: the colour word is marked in its own colour, and joins the palette for this painting
const paletteEl=document.getElementById('palette');
function pickOut(word,end){
  const text=wordEndingAt(end), a=end-text.length, c=hex(HUE[word]);
  for(let i=a;i<end;i++){ spans[i].classList.add('hue'); spans[i].style.setProperty('--h',css(c,0.38)); spans[i].dataset.hue=1; }
  if([...paletteEl.children].some(s=>s.dataset.w===word)) return;
  const chip=document.createElement('span'); chip.dataset.w=word; chip.style.setProperty('--h',HUE[word]);
  chip.innerHTML='<i></i>'; chip.appendChild(document.createTextNode(text.toLowerCase())); paletteEl.appendChild(chip);
}
function finish(){
  done=true; typed=total; const tk=token;
  setTimeout(()=>{ if(tk!==token) return; ready=true; readyAt=performance.now(); viewBtn.hidden=false; const sg=document.getElementById('sig'); if(sg) sg.classList.add('on'); promptEl.classList.add('idle'); spans.forEach(sp=>{ if(sp.className==='cur') sp.className='ok'; }); statsEl.textContent=pi<PAINTINGS.length-1?'Press space for the next painting':'Press space to begin again'; },450);
}
keys.addEventListener('input',()=>{ const v=keys.value; keys.value=''; for(const ch of v) key(ch); });
keys.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); key('\n'); } });
const focusKeys=()=>keys.focus({preventScroll:true});
stage.addEventListener('click',()=>{ if(ready) viewBtn.click(); else focusKeys(); });
document.getElementById('type').addEventListener('click',e=>{ if(e.target.tagName!=='BUTTON') focusKeys(); });
keys.addEventListener('blur',()=>{ promptEl.classList.add('idle'); typingMode(false); });
keys.addEventListener('focus',()=>{ typingMode(true); if(!coarse && window.parent!==window) parent.postMessage({dt:'focus'},location.origin); });
document.getElementById('done').addEventListener('click',()=>keys.blur());

// ---------- phones: while the keyboard is up, take over the screen above it ----------
// The case study page listens for this message and pins the frame to the visible part of the screen.
const coarse=matchMedia('(pointer: coarse)').matches, framed=window.parent!==window, vv=window.visualViewport;
let typingOn=false, offTimer=0;
function typingMode(on){
  if(!coarse) return;
  clearTimeout(offTimer);
  if(!on){ offTimer=setTimeout(()=>applyTyping(false),250); return; } // a tap on a button blurs for a moment; don't flicker
  applyTyping(true);
}
function applyTyping(on){
  if(on===typingOn) return; typingOn=on;
  document.documentElement.classList.toggle('mob',on);
  if(framed) parent.postMessage({dt:'typing',on},location.origin);
  else fitAlone();
}
function fitAlone(){ // opened on its own, not in the case study: size the page to the visible area
  const de=document.documentElement;
  if(typingOn&&vv){ de.style.height=vv.height+'px'; document.body.style.height=vv.height+'px'; window.scrollTo(0,0); }
  else { de.style.height=''; document.body.style.height=''; }
}
if(vv&&!framed){ vv.addEventListener('resize',fitAlone); }
if(coarse) document.getElementById('hint').textContent='Tap here and start typing';
document.getElementById('next').addEventListener('click',()=>{ setPainting(pi+1); focusKeys(); });
viewBtn.addEventListener('click',()=>{ showPainting=!showPainting; viewBtn.textContent=showPainting?'See the mosaic':'See the painting'; focusKeys(); });
let showNotes=true; const notesBtn=document.getElementById('letters');
notesBtn.addEventListener('click',()=>{ showNotes=!showNotes; notesBtn.setAttribute('aria-pressed',showNotes); });

// ---------- drawing ----------
let last=0;
function frame(now){
  const dt=last?Math.min(0.05,(now-last)/1000):0; last=now;
  const p=total?typed/total:0;
  const target=p*nInside*1.02;
  revealShown+=(target-revealShown)*(reduce?1:Math.min(1,dt*6));
  const satT=done?1:Math.min(1,0.1+0.75*Math.pow(p,1.3)+boost);
  sat+=(satT-sat)*(reduce?1:Math.min(1,dt*1.8));
  // the reveal: starts a beat after "Ever yours", then moves at a steady pace (2.4s to the painting, 0.8s back to the mosaic)
  const pT=ready&&showPainting&&now-readyAt>350?1:0;
  painting=reduce?pT:(pT>painting?Math.min(1,painting+dt/2.4):Math.max(0,painting-dt/0.8));
  draw(now);
  requestAnimationFrame(frame);
}
function draw(now){
  const dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  ctx.fillStyle=css(PAPER); ctx.fillRect(0,0,W,H);
  if(!col) return;
  const fade=Math.max(1,nInside*0.012);
  for(let i=0;i<cols*rows;i++){
    if(!inside[i]) continue;
    const o=i*3, r=col[o], g=col[o+1], b=col[o+2], L=0.3*r+0.59*g+0.11*b;
    // a painted word lays its part of the picture down early, in full colour, with a brief glow of that colour
    let pw=0, glow=0, gc=null;
    for(const M of MASKS){ const v=M.m[i]; if(!v) continue; const age=now-M.t0, w=v*(reduce?1:Math.min(1,Math.max(0,(age-(1-v)*500)/600))); if(w>pw) pw=w; const gl=v*Math.max(0,1-age/1600); if(gl>glow){ glow=gl; gc=M.rgb; } }
    const s=sat+(1-sat)*pw;
    let c=[L+(r-L)*s, L+(g-L)*s, L+(b-L)*s];
    if(glow>0&&!reduce) c=mix(c,gc,0.35*glow);
    const a=Math.max(pw,Math.max(0,Math.min(1,(revealShown-rank[i])/fade)));
    if(a<1){ const ghost=mix(PAPER,[L,L,L],0.13); c=mix(ghost,c,a); }
    ctx.fillStyle=css(c); ctx.fillRect((i%cols)*ts,Math.floor(i/cols)*ts,ts,ts);
  }
  // grout
  const pe=ease(painting); ctx.fillStyle=`rgba(0,0,0,${0.10*(1-Math.min(1,pe*2.5))})`;
  for(let r0=1;r0<rows;r0++) ctx.fillRect(0,r0*ts-0.25,W,0.5);
  for(let c0=1;c0<cols;c0++) ctx.fillRect(c0*ts-0.25,0,0.5,H);
  // colour notes, written in one letter at a time, fading like ink when the page turns
  ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.font=`500 ${ts*1.5}px "Geist Mono", ui-monospace, monospace`;
  for(let k=LABELS.length-1;k>=0;k--){
    const Lb=LABELS[k]; const a=(Lb.out?1-(now-Lb.out)/900:1)*(1-Math.min(1,pe*3));
    if(a<=0){ LABELS.splice(k,1); continue; }
    if(!showNotes) continue;
    for(let i=0;i<Lb.t.length;i++){
      const ti=now-Lb.t0-i*70; if(ti<0) break;
      const ai=a*Math.min(1,ti/350), x=(Lb.col+i*2)*ts, y=Lb.row*ts, o=((Lb.row+1)*cols+Lb.col+i*2+1)*3;
      const tile=[col[o],col[o+1],col[o+2]], tl=0.3*tile[0]+0.59*tile[1]+0.11*tile[2];
      const t2=[tl+(tile[0]-tl)*sat, tl+(tile[1]-tl)*sat, tl+(tile[2]-tl)*sat], light=lum(t2)>0.5;
      ctx.fillStyle=css(mix(t2, light?BLACK:WHITE, 0.14),ai); ctx.fillRect(x+0.4,y+0.4,ts*2-0.8,ts*2-0.8);
      ctx.fillStyle=css(light?mix(t2,BLACK,0.75):mix(t2,WHITE,0.8),ai);
      ctx.fillText(Lb.t[i], x+ts, y+ts*1.06);
    }
  }
  ctx.textAlign='start';
  // the finished painting: the tiles get finer and finer until it is the painting itself
  if(pe>0.002 && place){ const im=images[current.img]; if(im){
    const px=ts*Math.pow(1-pe,1.6);                       // tile size, shrinking from a mosaic tile to nothing
    ctx.globalAlpha=Math.min(1,pe/0.18);
    if(px>1.2){
      const w=Math.max(1,Math.round(place.w/px)), h=Math.max(1,Math.round(place.h/px));
      if(sharp.width!==w||sharp.height!==h){ sharp.width=w; sharp.height=h; }
      const g=sharp.getContext('2d'); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high'; g.drawImage(im,0,0,w,h);
      ctx.imageSmoothingEnabled=false; ctx.drawImage(sharp,place.x0,place.y0,place.w,place.h);
    } else { ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; ctx.drawImage(im,place.x0,place.y0,place.w,place.h); }
    ctx.imageSmoothingEnabled=true; ctx.globalAlpha=1; } }
}

new ResizeObserver(()=>resize()).observe(stage);
loadImages().then(()=>{ resize(); setPainting(0); requestAnimationFrame(frame); });
})();
</script>
